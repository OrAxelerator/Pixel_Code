[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-code"
version = "0.4.0"
description = "Pixel_Code - TUI pour gérer et ouvrir des projets"
requires-python = ">=3.8"
dependencies = [
    "colorama",
    "requests",
    "windows-curses"
]
windows-curses = { version = "^2.4", optional = true }
[project.scripts]
pixel-code = "pixel_code.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
pixel_code = ["*.json", "*.txt"]